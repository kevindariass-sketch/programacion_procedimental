<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Cofla!!!</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>

<body>

    <center>
        <h1 class="title is-1">Sección de Pedidos</h1>
        <p class="subtitle">Elige tus productos</p>
    </center>

    <br>

    <div class="box-pedido">
        <center>
            <div class="field">
                <label class="label">Cofla!!! Selecciona tu Producto</label>
                <div class="control">
                    <div class="select is-fullwidth is-link">
                        <select>
                            <option>Pizza anti dogors</option>
                            <option>Pastel Cofla</option>
                            <option>Al estilo Coflas</option>
                            <option>La Cofladora</option>
                        </select>
                    </div>
                </div>
            </div>
        </center>

        <center>
            <div class="field">
                <label class="label">Nombre de Usuario</label>
                <div class="control">
                    <input class="input is-link" type="text" placeholder="Ej: Cofladora">
                </div>
            </div>
        </center>

        <center>
            <div class="field">
                <label class="label">Dirección de Entrega</label>
                <div class="control">
                    <input class="input is-link" type="text" placeholder="Ej: Calle Falsa 123">
                </div>
            </div>
        </center>

        <center>
            <div class="field">
                <label class="label">Teléfono</label>
                <div class="control">
                    <input class="input is-link" type="tel" placeholder="Ej: 333...">
                </div>
            </div>
        </center>

        <center>
            <div class="mt-5">
                <button class="button is-link is-large is-fullwidth">
                    <strong>Realizar Pedido</strong>
                </button>
            </div>
        </center>
    </div>

    <section class="section">
        <div class="container">
            <a href="../index.html" class="button is-link is-outlined">
                <span class="icon">
                    <i class="fas fa-home"></i>
                </span>
                <span>Volver al Inicio</span>
            </a>
        </div>
    </section>

</body>

</html>
