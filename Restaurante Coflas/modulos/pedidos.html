<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Cofla!!!</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<section class="section">

    <div class="container" style="max-width:700px;">

        <h1 class="title has-text-centered">
            Sección de Pedidos
        </h1>

        <p class="subtitle has-text-centered">
            Elige tus productos
        </p>

        <div class="box">

            <form id="formPedido" onsubmit="validarPedido(event)">

                <div class="field">
                    <label class="label">Selecciona tu Producto</label>

                    <div class="control">
                        <div class="select is-fullwidth is-link">

                            <select id="producto">
                                <option value="">Seleccione un producto</option>
                                <option>Pizza anti dogors</option>
                                <option>Pastel Cofla</option>
                                <option>Al estilo Coflas</option>
                                <option>La Cofladora</option>
                            </select>

                        </div>
                    </div>
                </div>

                <div class="field">
                    <label class="label">Nombre de Usuario</label>

                    <div class="control">
                        <input
                            id="nombre_usuario"
                            class="input is-link"
                            type="text"
                            placeholder="Ej: Cofladora">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Dirección de Entrega</label>

                    <div class="control">
                        <input
                            id="direccion"
                            class="input is-link"
                            type="text"
                            placeholder="Ej: Calle Falsa 123">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Teléfono</label>

                    <div class="control">
                        <input
                            id="telefono"
                            class="input is-link"
                            type="tel"
                            placeholder="Ej: 3001234567">
                    </div>
                </div>

                <button
                    id="btnEnviar"
                    class="button is-link is-fullwidth"
                    type="submit">

                    <strong>Realizar Pedido</strong>

                </button>

            </form>

        </div>

    </div>

</section>

<section class="section">
    <div class="container">

        <button
            id="btnInicio"
            class="button is-link is-outlined">

            <span class="icon">
                <i class="fas fa-home"></i>
            </span>

            <span>Volver al Inicio</span>

        </button>

    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../coflas.js/pedidos.js"></script>

</body>

</html>
