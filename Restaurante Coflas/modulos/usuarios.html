<!DOCTYPE html>
<html lang="en">
<head>

    <title>Registro Cofla</title>
</head>
<body>
   <center>
    <div class="field">

</div>
</center>

<center>
<div class="field">
  <label class="label">Contraseña</label>

    <input class="input" type="email" placeholder="e.g. alexsmith@gmail.com">
  </div>
  </center>

  <center>
<div class="field">
  <label class="label">Genero</label>
  <div class="control">
    <input class="input" type="email" placeholder="e.g. alexsmith@gmail.com">
  </div>
  </center>
 
  <center>
<div class="field">
  <label class="label">Fecha de Nacimiento</label>

    <input class="input" type="email" placeholder="e.g. alexsmith@gmail.com">
  </div>
  </center>

  <center>
<div class="field">
  <label class="label">Telefono</label>
  <div class="control">
    <input class="input" type="email" placeholder="e.g. alexsmith@gmail.com">
  </div>
  </center>

  <center>
<div class="field">
  <label class="label">Email</label>
  <div class="control">
    <input class="input" type="email" placeholder="e.g. alexsmith@gmail.com">
  </div>
  </center>
</div>
</body>
</html>
