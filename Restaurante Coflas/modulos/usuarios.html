<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Cofla</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>

<body>

  <center>
    <h1 class="title">Registro Cofla</h1>
  </center>

  <center>
    <div class="field">
      <label class="label">Nombre</label>
      <div class="control">
        <input class="input is-info" type="text" placeholder="Ej: El May">
      </div>
    </div>
  </center>

  <center>
    <div class="field">
      <label class="label">Contraseña</label>
      <div class="control">
        <input class="input is-info" type="password" placeholder="Tu clave secreta">
      </div>
    </div>
  </center>

  <center>
    <div class="field">
      <label class="label">Género</label>
      <div class="control">
        <div class="select is-fullwidth">
          <select>
            <option>Masculino</option>
            <option>Femenino</option>
            <option>Otro</option>
          </select>
        </div>
      </div>
    </div>
  </center>

  <center>
    <div class="field">
      <label class="label">Fecha de Nacimiento</label>
      <div class="control">
        <input class="input is-info" type="date">
      </div>
    </div>
  </center>

  <center>
    <div class="field">
      <label class="label">Teléfono</label>
      <div class="control">
        <input class="input is-info" type="tel" placeholder="Ej: 312515...">
      </div>
    </div>
  </center>

  <center>
    <div class="field">
      <label class="label">Email</label>
      <div class="control">
        <input class="input is-info" type="email" placeholder="dogorcofla@gmail.com">
      </div>
    </div>
  </center>

  <center>
    <button class="button is-success is-large">Registrar
      <a href=""></a>
    </button>
  </center>

  <section class="section">
    <div class="container">

      <a href="../index.html" class="button is-link is-outlined">
        <span class="icon">
          <i class="fas fa-home"></i>
        </span>
        <span>Volver al Inicio</span>
      </a>
    </div>
  </section>

</body>

</html>
