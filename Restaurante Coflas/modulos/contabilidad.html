<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contabilidad</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <section class="section">
        <div class="container" style="max-width:700px;">

            <h1 class="title has-text-centered">
                Gestión de Contabilidad de Cofla
            </h1>

            <div class="box">

                <form id="form-contabilidad" onsubmit="validarDatos(event)">

                    <div class="field">
                        <label class="label">Ventas</label>
                        <div class="control">
                            <input id="ventas" class="input" type="number" placeholder="Ingrese las ventas">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Fecha</label>
                        <div class="control">
                            <input id="fecha_contabilidad" class="input" type="date">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Ingresos</label>
                        <div class="control">
                            <input id="ingresos" class="input" type="number" placeholder="Ingrese ingresos">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Egresos</label>
                        <div class="control">
                            <input id="egresos" class="input" type="number" placeholder="Ingrese egresos">
                        </div>
                    </div>

                    <button class="button is-link" type="submit">
                        Envia tus fucking datos Coflaaaa!!!
                    </button>

                </form>

            </div>

        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../coflas.js/contabilidad.js"></script>
</body>

</html>
